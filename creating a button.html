<!DOCTYPE html>
<html>
<title>Creating A Button</title>

<head>creating a button</head>
<br>
<hr>
<br>
<hr>
<div>
<form action="index.php" method="post">
    <label for="Username">username</label>
    <br>
    <input type="text" id="username" placeholder="oteniyatobi" minlength="7" maxlength="15" required>
    <br>
    <label for="Password">Password</label>
    <br>
    <input type="password" id="password" required minlength="7" maxlength="7">
    <br>
    <label for="E-mail">E-mail</label>
    <br>
    <input type="E-mail" id="E-mail" required placeholder="zzzz@gmail.com">
    <br>
    <label for="Phone">Phone</label>
    <br>
    <input type="Phone" id="Phone" required placeholder="123-456-789-0" pattern="[0-9](3)-[0-9](3)-[0-9](4)">
    <br>
    <label for="birthdate">Birthdate</label>
    <br>
    <input type="date" id="birthdate" required>
    <br>
    <label for="Quantity">Quantity</label>
    <br>
    <input type="number" id="Quantity" min="0" max="20">
    <br>
    <label for="title">Title</label>
    <br>

    <label for="Mr">Mr</label>
    <input type="radio" id="Mr" value="Mr" name="title">
    <label for="mrs">Mrs</label>
    <input type="radio" id="Mrs" value="Mrs" name="title">
    <label for="miss">Miss</label>
    <input type="radio" id="Miss" value="Miss" name="title">
    <br>
    <label for="payment">Payment</label>
    <select name="" id="">
        <option value=""></option>
    </select>
    <br>
    <input type="submit">
    <br>
    <a href="https://www.alueducation.com">
    <button style="font-size:20px; background-color: aqua; color: blue; border-radius: 27px;">CLICK ME</button>
</a>
    
    <input type="reset">
</form>
</div>
</html>
